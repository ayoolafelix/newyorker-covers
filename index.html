<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Every New Yorker Cover, 1925&ndash;2026</title>
<meta name="description" content="All 5,104 New Yorker covers published since February 1925, as an infinite draggable WebGL grid." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- parallax backdrop: layers drift at different rates behind the grid -->
  <div class="backdrop" aria-hidden="true">
    <div class="layer l1" data-depth="0.06"></div>
    <div class="layer l2" data-depth="0.12"></div>
    <div class="layer l3" data-depth="0.20"></div>
  </div>

  <canvas id="gl"></canvas>

  <header class="hud">
    <h1>The New Yorker Cover Archive</h1>
  </header>

  <a class="credit" id="credit" href="#" target="_blank" rel="noopener noreferrer">click for full size</a>

  <div class="stalker" id="stalker" aria-hidden="true"></div>
  <div class="loader" id="loader"><span>loading covers&hellip;</span></div>

  <!-- detail pane, slides in from the right -->
  <aside class="pane" id="pane" aria-hidden="true" role="dialog" aria-label="Cover detail">
    <button class="pane__close" id="paneClose" aria-label="Close">&times;</button>
    <div class="pane__scroll">
      <figure class="pane__fig">
        <img id="paneImg" alt="" />
        <figcaption id="paneCaption"></figcaption>
      </figure>
      <h2 class="pane__date" id="paneDate">&nbsp;</h2>
      <dl class="pane__meta" id="paneMeta" hidden>
        <dt>Cover</dt><dd id="paneArtist">&nbsp;</dd>
        <dt>Title</dt><dd id="paneTitle">&nbsp;</dd>
      </dl>
      <a class="pane__link" id="paneLink" href="#" target="_blank" rel="noopener">read the issue &rarr;</a>
    </div>
  </aside>
  <div class="pane__scrim" id="paneScrim" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
